# slam_toolbox (online async) for the AutoDRIVE F1TENTH vehicle.
#
# This node OWNS the map -> odom transform. The EKF owns odom -> f1tenth_1 and
# autodrive_incoming_bridge owns everything below f1tenth_1. Make sure the
# bridge's publish_ground_truth_tf parameter stays false, or f1tenth_1 will end
# up with two parents and TF will break.

slam_toolbox:
  ros__parameters:

    # --- Frames and topics ---------------------------------------------------
    # Non-default: this vehicle's body frame is f1tenth_1, not base_link, and
    # the scan topic is namespaced.
    odom_frame: odom
    map_frame: map
    base_frame: f1tenth_1
    scan_topic: /autodrive/f1tenth_1/lidar

    # 'mapping' builds a new map; 'localization' localises against a saved one.
    # In localization mode map_file_name below must point at an existing
    # map (container path, NO extension - slam_toolbox appends .posegraph/.data
    # itself, so it needs the serialised pair, not the .pgm/.yaml pair).
    mode: localization

    # Serialised pose graph produced by slam_toolbox's "Serialize Map" panel.
    # This is NOT the map_saver .pgm/.yaml - that pair is for nav2_map_server
    # and the particle filter. Only read in localization mode.
    map_file_name: /home/ubuntu/ros2_ws/src/autodrive_f1tenth/maps/track_serial

    # Where to start localising from, in the map frame. [0, 0, 0] is the pose
    # the vehicle was at when mapping began.
    map_start_pose: [0.0, 0.0, 0.0]
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05

    # Must not exceed the LiDAR's configured range_max (10.0 m in the bridge)
    max_laser_range: 10.0

    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # --- Scan matching -------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
